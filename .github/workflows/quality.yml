name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lua:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 luarocks python3
          sudo python3 Tools/install_lua_tools.py

      - name: Validate repository
        run: python3 Tools/validate.py --lua lua5.1
