name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 luarocks
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install luacheck

      - name: Lint
        run: lua5.1 "$(command -v luacheck)" .

      - name: Test addon modules
        run: lua5.1 "$(command -v busted)" --pattern='test_.*%.lua' Tests

      - name: Test pure actions
        run: lua5.1 "$(command -v busted)" Tests/Core
